  function gsHexPoints(cx, cy, r){
    var pts = [];
    for(var i=0;i<6;i++){
      var angle = (Math.PI/180)*(60*i-90);
      pts.push((cx+r*Math.cos(angle)).toFixed(2)+","+(cy+r*Math.sin(angle)).toFixed(2));
    }
    return pts.join(" ");
  }
  function gsFullHexGrid(x0,y0,x1,y1,r,gradId,edgeStroke,edgeOpacity,fillOpacity){
    var w = r*Math.sqrt(3), h = r*1.5;
    var polys = [];
    // Row phase is anchored to a shared global origin (y=0), not this call's own y0 --
    // this call only WINDOWS into a slice of one continuous infinite grid. That's what
    // keeps the blue-zone and silver-zone grids (drawn as two separately-clipped calls)
    // perfectly aligned with each other at the diagonal seam between them, rather than
    // each being its own independently-phased grid that happens to sit near the other.
    var row = Math.floor((y0 - r) / h);
    var y = row * h;
    while(y - r <= y1){
      var parity = ((row % 2) + 2) % 2; // normalize JS modulo for negative row indices
      var xOffset = parity === 1 ? w/2 : 0;
      var x = x0 - w + xOffset;
      while(x - w/2 <= x1){
        polys.push('<polygon points="'+gsHexPoints(x,y,r)+'" fill="url(#'+gradId+')" fill-opacity="'+fillOpacity+'" stroke="'+edgeStroke+'" stroke-width="1.5" stroke-opacity="'+edgeOpacity+'"/>');
        x += w;
      }
      row++;
      y = row * h;
    }
    return polys.join("");
  }
  function gsStarPoints(cx,cy,outerR,innerR){
    var coords = [];
    var angleStep = Math.PI/5;
    var startAngle = (Math.PI/180)*(-90);
    for(var i=0;i<10;i++){
      var r = (i%2===0)?outerR:innerR;
      var angle = startAngle + i*angleStep;
      coords.push((cx+r*Math.cos(angle)).toFixed(1)+","+(cy+r*Math.sin(angle)).toFixed(1));
    }
    return coords.join(" ");
  }
  function gsElevatedCardGradient(x,y,w,h,rx,gradId,lightColor,baseColor){

      +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" fill="url(#'+gradId+')"/>';
  }
  function gsElevatedCardFlat(x,y,w,h,rx,fill){

  function gsFmtDate(dateStr){
    if(!dateStr) return "";
    var parts = dateStr.split("-");
    if(parts.length!==3) return dateStr;
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    try{
      return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
    }catch(e){ return dateStr; }
  }

  function gsSummarizeGame(g){
    var totals = aggregate([g]);
    var goalScorers = [], assisters = [], saves = [];
    g.playerIds.forEach(function(pid){
      var t = totals[pid];
      if(!t) return;
      if(t.goals) goalScorers.push({name: playerName(pid), count: t.goals});
      if(t.assists) assisters.push({name: playerName(pid), count: t.assists});
      if(t.saves) saves.push({name: playerName(pid), count: t.saves});
    });
    function fmtList(arr){
      if(arr.length===0) return "None";
      return arr.map(function(p){ return p.count>1 ? p.name+" ("+p.count+")" : p.name; }).join(", ");
    }
    var score = computeScore(g);
    return {
      goalsText: fmtList(goalScorers),
      assistsText: fmtList(assisters),
      savesText: fmtList(saves),
      ourScore: score.our,
      theirScore: score.their
    };
  }

  // ---------- Heatmap ----------
  var heatmapState = null;

  function heatmapScopeGames(){
    if(heatmapState.mode === "game"){
      var g = state.games.filter(function(gg){ return gg.id === heatmapState.gameId; })[0];
      return g ? [g] : [];
    }
    return state.games.filter(function(gg){ return gg.status === "completed"; });
  }
  function heatmapPlayerOptions(){
    var games = heatmapScopeGames();
    var statKeys = Object.keys(heatmapState.statFilter).filter(function(k){ return heatmapState.statFilter[k]; });
    var ids = {};
    games.forEach(function(g){
      var scoped = heatmapState.mode === "season"
        ? (heatmapState.gameTypeFilter[g.gameType] ? g.events : [])
        : g.events;
      scoped.forEach(function(e){
        if(e.loc && statKeys.indexOf(e.stat) !== -1) ids[e.playerId] = true;
      });
    });
    return Object.keys(ids).sort(function(a,b){ return byLastName(playerName(a), playerName(b)); });
  }
  function heatmapMatchedEvents(){
    var statKeys = Object.keys(heatmapState.statFilter).filter(function(k){ return heatmapState.statFilter[k]; });
    if(heatmapState.mode === "game"){
      var g = state.games.filter(function(gg){ return gg.id === heatmapState.gameId; })[0];
      if(!g) return [];
      return heatmapEventsForGame(g, statKeys, heatmapState.player, heatmapState.period);
    }
    return heatmapEventsForSeason(heatmapScopeGames(), statKeys, heatmapState.player, heatmapState.gameTypeFilter);
  }

  // ---------- Game Report Generator ----------
  // A taller, letterhead-style document: box score timeline (goals with assists,
  // halftime/full-time markers) plus three player-stat tables (Attacking/Defending/
  // Goalkeeping), each filtered to players with any event in that group and sorted by
  // BPS descending. Reuses the hex-grid/elevated-card helpers built for Game Snapshot.
  var GR_BLUE = "#1a4fa8", GR_BLUE_DARK = "#0d2f6b", GR_BLUE_LIGHT_EDGE = "#3f6bc4";
  var GR_SILVER = "#c8d0d8", GR_INK = "#0a0d12", GR_DIM = "#5b6472";
  var GR_WHITE = "#ffffff", GR_LINE = "#d8dee6", GR_BAND = "#eef1f5";

  function grMinuteOffsets(g){
    // Maps each period's LABEL (as stored on events) to its starting minute offset,
    // walking g.periodPlan in order, then appending Extra Time labels if this game
    // actually has events there.
    var offsets = {};
    var acc = 0;
    (g.periodPlan || []).forEach(function(p){
      offsets[p.label] = acc;
      acc += p.durationSec / 60;
    });
    ["et1", "et2"].forEach(function(key){
      var label = periodLabel(g, key);
      if(offsets[label] === undefined){
        offsets[label] = acc;
        acc += FIXED_PERIOD_DURATIONS[key] / 60;
      }
    });
    return offsets;
  }
  function grEventMinute(g, e, offsets){
    var base = offsets[e.period] !== undefined ? offsets[e.period] : 0;
    return Math.floor(base + (e.clockSec || 0) / 60) + 1;
  }
  function grBuildTimeline(g){
    var offsets = grMinuteOffsets(g);
    var goalEvents = g.events.filter(function(e){ return e.stat === "goals" || e.stat === "goalsAllowed"; })
      .slice().sort(function(a,b){ return a.ts - b.ts; });
    var ourScore = 0, theirScore = 0;
    var timeline = [];
    var periodLabels = (g.periodPlan || []).map(function(p){ return p.label; });
    var seenPeriods = [];
    goalEvents.forEach(function(e){
      // Insert a HALFTIME-style marker whenever we cross into a new period for the
      // first time, as long as it's not the very first period of the game.
      if(seenPeriods.indexOf(e.period) === -1){
        if(seenPeriods.length > 0){
          var justFinishedIdx = periodLabels.indexOf(seenPeriods[seenPeriods.length-1]);
          var label = (justFinishedIdx === 0 && periodLabels.length > 1) ? "HALFTIME" : (seenPeriods[seenPeriods.length-1].toUpperCase() + " END");
          timeline.push({type:"period", label:label, score: ourScore+"\u2013"+theirScore});
        }
        seenPeriods.push(e.period);
      }
      if(e.stat === "goals"){
        ourScore++;
        var assist = g.events.filter(function(a){ return a.stat==="assists" && a.ts===e.ts; })[0];
        timeline.push({
          type:"goal", minute: grEventMinute(g,e,offsets),
          scorer: playerName(e.playerId), assist: assist ? playerName(assist.playerId) : null,
          us: true, score: ourScore+"\u2013"+theirScore, pen: !!e.pk
        });
      } else {
        theirScore++;
        timeline.push({
          type:"goal", minute: grEventMinute(g,e,offsets),
          scorer: g.opponent || "Opponent", assist: null,
          us: false, score: ourScore+"\u2013"+theirScore, pen: !!e.pk
        });
      }
    });
    timeline.push({type:"period", label:"FULL TIME", score: ourScore+"\u2013"+theirScore});
    return timeline;
  }
  function grStatRows(g, statKeys, minStat){
    var totals = aggregate([g]);
    var ids = g.playerIds.filter(function(pid){
      var t = totals[pid];
      if(!t) return false;
      return statKeys.some(function(k){ return (t[k]||0) > 0; });
    });
    ids.sort(function(a,b){
      var diff = computeBPS(totals,b) - computeBPS(totals,a);
      if(diff !== 0) return diff;
      return byLastName(playerName(a), playerName(b));
    });
    return ids.map(function(pid){
      var t = totals[pid] || {};
      var row = [playerName(pid)];
      statKeys.forEach(function(k){ row.push(t[k] || 0); });
      return row;
    });
  }
  function grSaveEntries(g){
    var totals = aggregate([g]);
    return g.playerIds.filter(function(pid){ return totals[pid] && totals[pid].saves; })
      .sort(function(a,b){ return (totals[b].saves||0) - (totals[a].saves||0); })
      .map(function(pid){ return {name: playerName(pid), count: totals[pid].saves}; });
  }
  function grTable(x, y, w, headers, statCenters, rows, title){
    var parts = [];
    var rowH = 42, headerH = 48, titleH = 34;
    parts.push('<text x="'+x+'" y="'+(y+22)+'" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="'+GR_BLUE+'">'+escapeHtml(title)+'</text>');
    var ty = y + titleH;
    parts.push('<rect x="'+x+'" y="'+ty+'" width="'+w+'" height="'+headerH+'" fill="'+GR_BLUE_DARK+'"/>');
    var positions = [x+16].concat(statCenters);
    headers.forEach(function(htext, i){
      var anchor = i===0 ? "start" : "middle";
      var tx = positions[i];
      var lines = Array.isArray(htext) ? htext : [htext];
      var lineY = ty + headerH/2 - (lines.length-1)*9 + 5;
      lines.forEach(function(line){
        parts.push('<text x="'+tx+'" y="'+lineY+'" text-anchor="'+anchor+'" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="0.5" fill="'+GR_WHITE+'">'+escapeHtml(line)+'</text>');
        lineY += 18;
      });
    });
    var ry = ty + headerH;
    if(rows.length === 0){
      parts.push('<rect x="'+x+'" y="'+ry+'" width="'+w+'" height="'+rowH+'" fill="'+GR_WHITE+'"/>');
      parts.push('<text x="'+(x+16)+'" y="'+(ry+27)+'" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-style="italic" font-size="16" fill="'+GR_DIM+'">No events recorded</text>');
      ry += rowH;
    } else {
      rows.forEach(function(row, ri){
        var bg = ri % 2 === 0 ? GR_WHITE : "#f4f6f9";
        parts.push('<rect x="'+x+'" y="'+ry+'" width="'+w+'" height="'+rowH+'" fill="'+bg+'"/>');
        row.forEach(function(val, i){
          var anchor = i===0 ? "start" : "middle";
          var tx = positions[i];
          var weight = i===0 ? "700" : "400";
          parts.push('<text x="'+tx+'" y="'+(ry+27)+'" text-anchor="'+anchor+'" font-family="Arial, Helvetica, sans-serif" font-weight="'+weight+'" font-size="17" fill="'+GR_INK+'">'+escapeHtml(String(val))+'</text>');
        });
        ry += rowH;
      });
    }
    parts.push('<rect x="'+x+'" y="'+ty+'" width="'+w+'" height="'+(headerH + rowH*Math.max(rows.length,1))+'" fill="none" stroke="'+GR_LINE+'" stroke-width="1.5"/>');
    return {svg: parts.join(""), height: titleH + headerH + rowH*Math.max(rows.length,1)};
  }
  function grStatColCenters(n, firstX, lastX){
    if(n === 1) return [(firstX+lastX)/2];
    var out = [];
    for(var i=0;i<n;i++) out.push(firstX + i*(lastX-firstX)/(n-1));
    return out;
  }
  function buildGameReportSVG(g){
    var W = 1080;
    var mhsLogoSrc = "data:image/png;base64," + MHS_LOGO_B64;
    var engLogoEl = document.querySelector(".brand-logo");
    var engLogoSrc = engLogoEl ? engLogoEl.getAttribute("src") : "";

    var opponent = (g.opponent || "Opponent").toUpperCase();
    var dateText = gsFmtDate(g.date);
    var gameTypeText = gameTypeLabel(g.gameType).toUpperCase();
    var timeline = grBuildTimeline(g);
    var saveEntries = grSaveEntries(g);

    var PLAYER_COL_WIDTH = 370;
    var STAT_AREA_X0 = 80 + PLAYER_COL_WIDTH;
    var STAT_AREA_X1 = 80 + 920;
    var slot = (STAT_AREA_X1 - STAT_AREA_X0) / 4;
    var FIRST_COL_X = STAT_AREA_X0 + slot/2;
    var LAST_COL_X = STAT_AREA_X1 - slot/2;

    var attackHeaders = ["PLAYER","GOALS","ASSISTS","SHOTS",["SHOTS ON","TARGET"]];
    var defendHeaders = ["PLAYER","BLOCKS","CLEARANCES","TACKLES"];
    var gkHeaders = ["PLAYER","SAVES",["GOALS","ALLOWED"],["CROSSES","CLAIMED"]];
    var attackRows = grStatRows(g, ["goals","assists","shots","shotsOnTarget"]);
    var defendRows = grStatRows(g, ["blocks","clearances","tackles"]);
    var gkRows = grStatRows(g, ["saves","goalsAllowed","crossesClaimed"]);

    var LETTERHEAD_H = 190;
    var BOXSCORE_TOP = LETTERHEAD_H + 40;
    var TIMELINE_ROW_H = 46, PERIOD_ROW_H = 40;
    var timelineH = timeline.reduce(function(sum,t){ return sum + (t.type==="period" ? PERIOD_ROW_H : TIMELINE_ROW_H); }, 0);
    var BOXSCORE_H = 34 + 14 + timelineH + 20 + 34;
    var STATS_TOP = BOXSCORE_TOP + BOXSCORE_H + 70;

    var attackT = grTable(80, 0, 920, attackHeaders, grStatColCenters(4,FIRST_COL_X,LAST_COL_X), attackRows, "ATTACKING");
    var defendT = grTable(80, 0, 920, defendHeaders, grStatColCenters(3,FIRST_COL_X,LAST_COL_X), defendRows, "DEFENDING");
    var gkT = grTable(80, 0, 920, gkHeaders, grStatColCenters(3,FIRST_COL_X,LAST_COL_X), gkRows, "GOALKEEPING");
    var TOTAL_H = Math.ceil(STATS_TOP + 40 + attackT.height + 30 + defendT.height + 30 + gkT.height + 60);

    var hexLetterhead = gsFullHexGrid(0,0,W,LETTERHEAD_H,44,"gradBlueLH","#0a1f4d",0.35,0.35);

    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+TOTAL_H+'" viewBox="0 0 '+W+' '+TOTAL_H+'">'
      + '<defs><linearGradient id="gradBlueLH" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3d6fc9"/><stop offset="45%" stop-color="#1a4fa8"/><stop offset="100%" stop-color="#0d2f6b"/></linearGradient>'
      + '<clipPath id="clipLH"><rect x="0" y="0" width="'+W+'" height="'+LETTERHEAD_H+'"/></clipPath></defs>'
      + '<rect x="0" y="0" width="'+W+'" height="'+TOTAL_H+'" fill="'+GR_WHITE+'"/>'
      + '<rect x="0" y="0" width="'+W+'" height="'+LETTERHEAD_H+'" fill="'+GR_BLUE+'"/>'
      + '<g clip-path="url(#clipLH)">'+hexLetterhead+'</g>'
      + '<circle cx="100" cy="95" r="58" fill="'+GR_WHITE+'"/>'
      + '<image href="'+mhsLogoSrc+'" x="48" y="43" width="104" height="91" preserveAspectRatio="xMidYMid meet"/>'
      + (engLogoSrc ? '<image href="'+engLogoSrc+'" x="920" y="35" width="110" height="100" preserveAspectRatio="xMidYMid meet"/>' : "")
      + '<text x="178" y="55" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" letter-spacing="3" fill="'+GR_SILVER+'">MIDVIEW GIRLS SOCCER</text>'
      + '<text x="178" y="84" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" letter-spacing="2" fill="'+GR_WHITE+'">'+escapeHtml(gameTypeText)+'</text>'
      + '<text x="178" y="110" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="'+GR_SILVER+'">'+escapeHtml(dateText)+'</text>'
      + '<text x="178" y="155" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="'+GR_WHITE+'">MIDVIEW <tspan fill="'+GR_SILVER+'" font-size="22" font-weight="700">vs</tspan> '+escapeHtml(opponent)+'</text>';

    var by = BOXSCORE_TOP;
    svg += '<text x="80" y="'+(by+22)+'" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" letter-spacing="2" fill="'+GR_BLUE+'">BOX SCORE</text>'
      + '<text x="'+(W-80)+'" y="'+(by+22)+'" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="1" fill="'+GR_DIM+'">MIDVIEW &#8211; '+escapeHtml(opponent)+'</text>'
      + '<line x1="80" y1="'+(by+34)+'" x2="'+(W-80)+'" y2="'+(by+34)+'" stroke="'+GR_LINE+'" stroke-width="2"/>';
    var gy = by + 34 + 14;
    timeline.forEach(function(item){
      if(item.type === "goal"){
        var color = item.us ? GR_INK : GR_DIM;
        var weight = item.us ? "700" : "400";
        var penText = item.pen ? '  <tspan fill="'+GR_DIM+'" font-weight="400" font-size="16">(pen)</tspan>' : "";
        var assistText = item.assist ? '  <tspan fill="'+GR_DIM+'" font-weight="400" font-size="16">(assist: '+escapeHtml(item.assist)+')</tspan>' : "";
        svg += '<text x="80" y="'+(gy+24)+'" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="'+GR_BLUE+'">'+item.minute+'&#8217;</text>'
          + '<text x="130" y="'+(gy+24)+'" font-family="Arial, Helvetica, sans-serif" font-weight="'+weight+'" font-size="18" fill="'+color+'">'+escapeHtml(item.scorer)+penText+assistText+'</text>'
          + '<text x="'+(W-80)+'" y="'+(gy+24)+'" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="'+GR_INK+'">'+item.score+'</text>';
        gy += TIMELINE_ROW_H;
      } else {
        svg += '<rect x="80" y="'+gy+'" width="'+(W-160)+'" height="'+(PERIOD_ROW_H-6)+'" fill="'+GR_BAND+'"/>'
          + '<text x="80" y="'+(gy+24)+'" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="'+GR_INK+'">'+escapeHtml(item.label)+'</text>'
          + '<text x="'+(W-80)+'" y="'+(gy+24)+'" text-anchor="end" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="'+GR_BLUE+'">'+item.score+'</text>';
        gy += PERIOD_ROW_H;
      }
    });
    gy += 20;
    var savesText = saveEntries.length ? saveEntries.map(function(s){ return s.name+" ("+s.count+")"; }).join(", ") : "None";
    svg += '<text x="80" y="'+(gy+18)+'" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" letter-spacing="1" fill="'+GR_BLUE+'">SAVES <tspan fill="'+GR_DIM+'" font-weight="400">&#8211;</tspan> <tspan fill="'+GR_INK+'" font-weight="700">'+escapeHtml(savesText)+'</tspan></text>';

    var sy = STATS_TOP;
    svg += '<text x="80" y="'+sy+'" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" letter-spacing="2" fill="'+GR_BLUE+'">PLAYER STATS</text>';
    sy += 40;
    var attackT2 = grTable(80, sy, 920, attackHeaders, grStatColCenters(4,FIRST_COL_X,LAST_COL_X), attackRows, "ATTACKING");
    svg += attackT2.svg; sy += attackT2.height + 30;
    var defendT2 = grTable(80, sy, 920, defendHeaders, grStatColCenters(3,FIRST_COL_X,LAST_COL_X), defendRows, "DEFENDING");
    svg += defendT2.svg; sy += defendT2.height + 30;
    var gkT2 = grTable(80, sy, 920, gkHeaders, grStatColCenters(3,FIRST_COL_X,LAST_COL_X), gkRows, "GOALKEEPING");
    svg += gkT2.svg; sy += gkT2.height + 40;

    svg += "</svg>";
    return svg;
  }
  function generateGameReportImage(gameId){
    if(!can(getCurrentRole(), "gameReport", "generate")){ showToast("You don't have permission to generate this"); return; }
    var g = state.games.filter(function(gg){ return gg.id===gameId; })[0];
    if(!g) return;
    showToast("Generating report\u2026");
    var svgStr = buildGameReportSVG(g);
    var svgBlob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = img.height;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){
        if(!blob){ showToast("Couldn't generate the report \u2014 try again"); return; }
        var filename = "midview-report-vs-" + (g.opponent||"opponent").replace(/[^a-z0-9]+/gi,"-").toLowerCase() + "-" + g.date + ".png";
        gsShowPreview(blob, filename);
      }, "image/png");
    };
    img.onerror = function(){
      showToast("Couldn't generate the report \u2014 try again");
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  function downloadCSV(rows, filename){
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var c = String(cell);
        if(c.indexOf(",")!==-1 || c.indexOf('"')!==-1 || c.indexOf("\n")!==-1){
          c = '"' + c.replace(/"/g,'""') + '"';
        }
        return c;
      }).join(",");
    }).join("\n");
    var blob = new Blob([csv], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function toCSV(totals, playerIds, label){
    var rows = [["Player"].concat(VISIBLE_STATS.map(function(s){return s.label;})).concat(["BPS"])];
    playerIds.forEach(function(pid){
      var row = [playerName(pid)];
      VISIBLE_STATS.forEach(function(s){
        row.push(((totals[pid] && totals[pid][s.key]) || 0));
      });
      row.push(computeBPS(totals, pid));
      rows.push(row);
    });
    downloadCSV(rows, label);
  }

  function exportEventsCSV(games, label){
    var rows = [["Date","Opponent","Game Type","Player","Stat","Period","Game Clock","Logged At","Location X","Location Y"]];
    var sortedGames = games.slice().sort(function(a,b){
      return (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0);
    });
    sortedGames.forEach(function(g){
      var sortedEvents = g.events.slice().sort(function(a,b){ return a.ts-b.ts; });
      sortedEvents.forEach(function(e){
        rows.push([
          fmtDate(g.date),
          g.opponent,
          gameTypeLabel(g.gameType),
          playerName(e.playerId),
          statLabel(e.stat),
          eventPeriod(e),
          fmtClock(e.clockSec),
          new Date(e.ts).toLocaleString(),
          e.loc ? e.loc.x.toFixed(3) : "",
          e.loc ? e.loc.y.toFixed(3) : ""
        ]);
      });
    });
    downloadCSV(rows, label);
  }

          });
        } else {
          state.games = state.games.filter(function(gg){ return gg.id!==id; });
          save();
          renderStats();
        }
      });
    });

  // Merges roster entries that share a name (case-insensitive) but ended up with different
  // ids — the class of bug that happens if a cloud roster doc gets pulled in with an id that
  // doesn't match an existing local entry for the same person. Keeps the oldest id as
  // canonical and remaps every game's playerIds/events so no logged stats get orphaned.
  function dedupeRoster(){
    var groups = {};
    state.roster.forEach(function(p){
      var key = (p.name || "").trim().toLowerCase();
      if(!key) return;
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    });
    function idTimestamp(id){
      var parts = (id || "").split("_");
      if(parts.length < 2) return Number.MAX_SAFE_INTEGER;
      var t = parseInt(parts[1], 36);
      return isNaN(t) ? Number.MAX_SAFE_INTEGER : t;
    }
    var idRemap = {};
    var newRoster = [];
    Object.keys(groups).forEach(function(key){
      var group = groups[key];
      if(group.length === 1){
        newRoster.push(group[0]);
        return;
      }
      var sorted = group.slice().sort(function(a,b){ return idTimestamp(a.id) - idTimestamp(b.id); });
      var canonical = sorted[0];
      var merged = {id: canonical.id, name: canonical.name};
      ["number", "position", "year", "squad"].forEach(function(f){
        var val = "";
        for(var i=0;i<sorted.length;i++){
          if(sorted[i][f]){ val = sorted[i][f]; break; }
        }
        merged[f] = val;
      });
      newRoster.push(merged);
      sorted.slice(1).forEach(function(p){
        if(p.id !== canonical.id) idRemap[p.id] = canonical.id;
      });
    });
    var remapCount = Object.keys(idRemap).length;
    if(remapCount === 0) return 0;

    state.games.forEach(function(g){
      if(g.playerIds){
        var seen = {};
        g.playerIds = g.playerIds.map(function(id){ return idRemap[id] || id; }).filter(function(id){
          if(seen[id]) return false;
          seen[id] = true;
          return true;
        });
      }
      if(g.events){
        g.events.forEach(function(e){
          if(e.playerId && idRemap[e.playerId]) e.playerId = idRemap[e.playerId];
        });
      }
    });
    state.roster = newRoster;
    save();
    return remapCount;
  }

  function mergeCloudRoster(cloudRoster){
    var changed = false;
    var fields = ["name", "number", "position", "year", "squad"];
    cloudRoster.forEach(function(cp){
      var existing = state.roster.filter(function(p){ return p.id===cp.id; })[0];
      if(!existing){
        state.roster.push({
          id: cp.id, name: cp.name,
          number: cp.number || "", position: cp.position || "", year: cp.year || "", squad: cp.squad || ""
        });
        changed = true;
      } else {
        fields.forEach(function(f){
          var cv = cp[f] || "";
          if((existing[f] || "") !== cv){
            existing[f] = cv;
            changed = true;
          }
        });
      }
    });
    if(changed) save();
    var merged = dedupeRoster();
    return changed || merged>0;
  }

  function mergeCloudGames(cloudGames){
    var changed = false;
    cloudGames.forEach(function(cg){
      var idx = -1;
      for(var i=0;i<state.games.length;i++){ if(state.games[i].id===cg.id){ idx=i; break; } }
      if(idx===-1){
        cg.cloudStatus = "uploaded";
        state.games.push(cg);
        changed = true;
      } else if(state.games[idx].cloudStatus === "uploaded"){
        cg.cloudStatus = "uploaded";
        state.games[idx] = cg;
        changed = true;
      }
      // A local, not-yet-uploaded game with the same id never gets overwritten.
    });
    if(changed) save();
    return changed;
  }

  function tryPushRoster(){
    if(!cloudReady() || !navigator.onLine) return;
    window.CloudSync.pushRoster(state.roster).catch(function(){ /* will retry on next change */ });
  }

  function pullFromCloud(onDone){
    if(!cloudReady() || !navigator.onLine){
      if(onDone) onDone(false);
      return;
    }
    Promise.all([
      window.CloudSync.pullRoster().then(mergeCloudRoster).catch(function(){ return false; }),
      window.CloudSync.pullGames().then(mergeCloudGames).catch(function(){ return false; })
    ]).then(function(results){
      cloudPulledThisSession = true;
      if(onDone) onDone(results.indexOf(true)!==-1);
    });
  }

  function handleUploadGame(gameId, rerenderFn){
    var g = null;
    for(var i=0;i<state.games.length;i++){ if(state.games[i].id===gameId){ g=state.games[i]; break; } }
    if(!g) return;
    if(!cloudReady()){
      showToast("Cloud not ready yet \u2014 try again in a moment");
      return;
    }
    if(!navigator.onLine){
      showToast("No connection \u2014 try again when online");
      return;
    }
    var wasAlreadyUploaded = g.cloudStatus === "uploaded";
    g.cloudStatus = "uploading";
    save();
    rerenderFn();
    window.CloudSync.uploadGame(g).then(function(){
      g.cloudStatus = "uploaded";
      save();
      showToast(wasAlreadyUploaded ? "Cloud copy updated" : "Uploaded to cloud");
      rerenderFn();
    }).catch(function(err){
      g.cloudStatus = "error";
      save();
      showToast("Upload failed \u2014 try again");
      rerenderFn();
    });
  }

  window.addEventListener("cloudsync-ready", function(){
    pullFromCloud(function(gotChanges){
      if(gotChanges && state.activeTab==="stats") renderStats();
    });
  });

  // ---------- Router ----------
  var TAB_LABEL = {roster:"roster", game:"live game", stats:"season stats"};
  function render(){
    document.querySelectorAll(".tabbar button").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-tab")===state.activeTab);
    });
    document.getElementById("headerSub").textContent = TAB_LABEL[state.activeTab] || "";
    var g = getActiveGame();
    if(g){
      var sc = computeScore(g);
      document.getElementById("headerRight").innerHTML = '<span class="half-chip">LIVE &middot; ' + sc.our + '-' + sc.their + '</span>';
    } else {
      document.getElementById("headerRight").innerHTML = "";
    }

    if(state.activeTab==="roster") renderRoster();
    else if(state.activeTab==="game") renderGame();
    else renderStats();
  }

  function startAppAfterAuth(){
    if(getActiveGame()) state.activeTab = "game";
    render();
    var dedupedAtLoad = dedupeRoster();
    if(dedupedAtLoad > 0){
      render();
      showToast("Merged " + dedupedAtLoad + " duplicate player" + (dedupedAtLoad===1?"":"s"));
    }
  }

  // ---------- Auth gate ----------
  var authMode = "login";
  var authGateEl = document.getElementById("authGate");
  var appEl = document.getElementById("app");
  var authEmailInput = document.getElementById("authEmail");
  var authPasswordInput = document.getElementById("authPassword");
  var authErrorEl = document.getElementById("authError");
  var authStatusEl = document.getElementById("authStatus");
  var authSubmitBtn = document.getElementById("authSubmitBtn");
  var authToggleModeBtn = document.getElementById("authToggleModeBtn");

  function showAuthError(msg){
    authErrorEl.textContent = msg;
    authErrorEl.style.display = "block";
  }
  function clearAuthError(){
    authErrorEl.style.display = "none";
    authErrorEl.textContent = "";
  }
  function friendlyAuthError(err){
    var code = (err && err.code) || "";
    var msg = (err && err.message) || "";
    if(msg.indexOf("NOT_INVITED") !== -1) return "This email hasn't been invited yet. Contact your admin.";
    if(code === "auth/wrong-password" || code === "auth/invalid-credential") return "Incorrect email or password.";
    if(code === "auth/user-not-found") return "No account found for that email.";
    if(code === "auth/email-already-in-use") return "An account already exists for that email \u2014 try logging in instead.";
    if(code === "auth/weak-password") return "Password should be at least 6 characters.";
    if(code === "auth/invalid-email") return "That doesn't look like a valid email address.";
    if(code === "auth/too-many-requests") return "Too many attempts \u2014 wait a bit and try again.";
    return "Something went wrong. Please try again.";
  }
  function setAuthMode(mode){
    authMode = mode;
    clearAuthError();
    authStatusEl.textContent = "";
    if(mode === "signup"){
      authSubmitBtn.textContent = "Create Account";
      authToggleModeBtn.textContent = "Already have an account? Log in";
      authPasswordInput.setAttribute("autocomplete", "new-password");
    } else {
      authSubmitBtn.textContent = "Log In";
      authToggleModeBtn.textContent = "Need an account? Create one";
      authPasswordInput.setAttribute("autocomplete", "current-password");
    }
  }
  authToggleModeBtn.addEventListener("click", function(){
    setAuthMode(authMode === "login" ? "signup" : "login");
  });
  document.getElementById("authForgotBtn").addEventListener("click", function(){
    clearAuthError();
    var email = authEmailInput.value.trim();
    if(!email){ showAuthError("Enter your email above first, then tap Forgot Password."); return; }
    if(!window.CloudSync){ showAuthError("Still loading \u2014 try again in a moment."); return; }
    window.CloudSync.sendPasswordReset(email).then(function(){
      authStatusEl.textContent = "Password reset email sent \u2014 check your inbox.";
    }).catch(function(err){
      showAuthError(friendlyAuthError(err));
    });
  });
  authSubmitBtn.addEventListener("click", function(){
    clearAuthError();
    authStatusEl.textContent = "";
    var email = authEmailInput.value.trim();
    var password = authPasswordInput.value;
    if(!email || !password){ showAuthError("Enter both email and password."); return; }
    if(!window.CloudSync){ showAuthError("Still loading \u2014 try again in a moment."); return; }
    authSubmitBtn.disabled = true;
    authStatusEl.textContent = (authMode === "signup") ? "Creating account\u2026" : "Signing in\u2026";
    var action = (authMode === "signup") ? window.CloudSync.signUp(email, password) : window.CloudSync.signIn(email, password);
    action.then(function(){
      authStatusEl.textContent = "";
    }).catch(function(err){
      authStatusEl.textContent = "";
      showAuthError(friendlyAuthError(err));
    }).finally(function(){
      authSubmitBtn.disabled = false;
    });
  });

  window.addEventListener("cloudsync-authenticated", function(e){
    var role = e.detail && e.detail.role;
    if(role){
      currentAuthRole = role;
      authGateEl.style.display = "none";
      appEl.style.display = "";
      startAppAfterAuth();
    } else {
      currentAuthRole = null;
      appEl.style.display = "none";
      authGateEl.style.display = "flex";
      authGateEl.innerHTML = '<div class="auth-card">'
        + '<div class="auth-brand">MiddieStat</div>'
        + '<div class="auth-error" style="display:block;">Your account isn\'t set up yet. Contact your admin to get a role assigned, then reload the app.</div>'
        + '<button class="btn ghost block" id="authSignOutBtn" type="button">Sign Out</button>'
        + '</div>';
      document.getElementById("authSignOutBtn").addEventListener("click", function(){
        window.CloudSync.signOutUser();
      });
    }
  });

  window.addEventListener("cloudsync-signedout", function(){
    currentAuthRole = null;
    appEl.style.display = "none";
    authGateEl.style.display = "flex";
  });
})();
</script>
<script>

  // Registers sw.js (must be uploaded alongside this file) so the app keeps
  // working with no signal after the first successful load. Silently does
  // nothing if service workers aren't supported in this context (e.g. file://).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
</script>
<script type="module">
  // ---------- Firebase Cloud Sync & Auth ----------
  var firebaseConfig = {
    apiKey: "AIzaSyDyevwe3xdaC7JRv_1WrjN5oHq8sZyVC5o",
    authDomain: "middiestat.firebaseapp.com",
    projectId: "middiestat",
    storageBucket: "middiestat.firebasestorage.app",
    messagingSenderId: "155416343909",
    appId: "1:155416343909:web:e51a55b9e93b7bc4bcdd8c"
  };

  import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js").then(function(appMod){
    return Promise.all([
      appMod,
      import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js")
    ]);
  }).then(function(mods){
    var appMod = mods[0], fsMod = mods[1], authMod = mods[2];

    var app = appMod.initializeApp(firebaseConfig);
    var db = fsMod.getFirestore(app);
    var auth = authMod.getAuth(app);
    var resolvedRole = null;

    function normalizeEmail(email){
      return (email || "").trim().toLowerCase();
    }

    // Fetches the signed-in user's profile (created at signup) to determine their role.
    // Relies on Firestore's own offline cache to keep working without a connection after
    // the first successful online login on this device.
    function resolveRole(user){
      return fsMod.getDoc(fsMod.doc(db, "users", user.uid)).then(function(snap){
        if(snap.exists()){
          resolvedRole = snap.data().role || null;
        } else {
          resolvedRole = null;
        }
        window.dispatchEvent(new CustomEvent("cloudsync-authenticated", {detail: {role: resolvedRole, email: user.email}}));
      }).catch(function(err){
        console.error("MiddieStat: failed to resolve role.", err);
        resolvedRole = null;
        window.dispatchEvent(new CustomEvent("cloudsync-authenticated", {detail: {role: null, email: user.email}}));
      });
    }

    authMod.onAuthStateChanged(auth, function(user){
      if(user){
        resolveRole(user).then(function(){
          window.dispatchEvent(new Event("cloudsync-ready"));
        });
      } else {
        resolvedRole = null;
        window.dispatchEvent(new Event("cloudsync-signedout"));
      }
    });

    function signIn(email, password){
      return authMod.signInWithEmailAndPassword(auth, normalizeEmail(email), password);
    }

    function signUp(email, password){
      var normEmail = normalizeEmail(email);
      return fsMod.getDoc(fsMod.doc(db, "invites", normEmail)).then(function(inviteSnap){
        if(!inviteSnap.exists()){
          return Promise.reject(new Error("NOT_INVITED"));
        }
        var invitedRole = inviteSnap.data().role || "player";
        return authMod.createUserWithEmailAndPassword(auth, normEmail, password).then(function(cred){
          return fsMod.setDoc(fsMod.doc(db, "users", cred.user.uid), {
            email: normEmail,
            role: invitedRole,
            createdAt: fsMod.serverTimestamp()
          }).then(function(){
            return fsMod.deleteDoc(fsMod.doc(db, "invites", normEmail));
          });
        });
      });
    }

    function signOutUser(){
      return authMod.signOut(auth);
    }

    function sendPasswordReset(email){
      return authMod.sendPasswordResetEmail(auth, normalizeEmail(email));
    }

    function pushRoster(roster){
      return Promise.all(roster.map(function(p){
        return fsMod.setDoc(fsMod.doc(db, "roster", p.id), {
          name: p.name,
          number: p.number || "",
          position: p.position || "",
          year: p.year || "",
          squad: p.squad || "",
          updatedAt: fsMod.serverTimestamp()
        });
      }));
    }

    function pullRoster(){
      return fsMod.getDocs(fsMod.collection(db, "roster")).then(function(snap){
        var out = [];
        snap.forEach(function(d){
          var data = d.data();
          out.push({
            id: d.id,
            name: data.name,
            number: data.number || "",
            position: data.position || "",
            year: data.year || "",
            squad: data.squad || ""
          });
        });
        return out;
      });
    }

    function deletePlayer(playerId){
      return fsMod.deleteDoc(fsMod.doc(db, "roster", playerId));
    }

    function uploadGame(game){
      var payload = JSON.parse(JSON.stringify(game));
      payload.running = false;
      payload.runStartedAt = null;
      payload.uploadedAt = Date.now();
      return fsMod.setDoc(fsMod.doc(db, "games", game.id), payload);
    }

    function pullGames(){
      return fsMod.getDocs(fsMod.collection(db, "games")).then(function(snap){
        var out = [];
        snap.forEach(function(d){ out.push(d.data()); });
        return out;
      });
    }

    function deleteGame(gameId){
      return fsMod.deleteDoc(fsMod.doc(db, "games", gameId));
    }

    window.CloudSync = {
      isReady: function(){ return !!(auth && auth.currentUser && resolvedRole); },
      getRole: function(){ return resolvedRole; },
      getEmail: function(){ return auth && auth.currentUser ? auth.currentUser.email : null; },
      signIn: signIn,
      signUp: signUp,
      signOutUser: signOutUser,
      sendPasswordReset: sendPasswordReset,
      pushRoster: pushRoster,
      pullRoster: pullRoster,
      deletePlayer: deletePlayer,
      uploadGame: uploadGame,
      pullGames: pullGames,
      deleteGame: deleteGame
    };
  }).catch(function(err){
    console.error("MiddieStat cloud sync: failed to load Firebase SDK.", err);
  });
</script>
